[package]
name = "iport"
version = "0.1.0"
description = "Cross-platform desktop command center for inspecting and managing local listening ports"
authors = ["yegekucuk"]
license = "MIT"
repository = "https://github.com/yegekucuk/iPort"
homepage = "https://github.com/yegekucuk/iPort"
readme = "../README.md"
edition = "2021"
default-run = "iport"

[lib]
name = "iport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
sysinfo = "0.33"
bollard = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
netstat2 = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
